name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate platform folders
        run: flutter create . --project-name khanjan_iot_home --org com.khanjan.iot

      - name: Fix Kotlin version
        run: |
          # به‌روزرسانی نسخه Kotlin در settings.gradle
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle || true
          fi
          # به‌روزرسانی در build.gradle (روش قدیمی)
          if [ -f android/build.gradle ]; then
            sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/" android/build.gradle || true
            sed -i 's/ext.kotlin_version = "[^"]*"/ext.kotlin_version = "1.9.24"/' android/build.gradle || true
          fi
          echo "=== settings.gradle ==="
          cat android/settings.gradle || true
          echo "=== build.gradle ==="
          cat android/build.gradle || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: khanjan-iot-home-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
